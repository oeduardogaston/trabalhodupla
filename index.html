
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Pessoal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="formulario">

            <h1>Cadastro Pessoal</h1>
            <p>Preencha seus dados abaixo</p>

            <form>

                <div class="grid-form">

                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" placeholder="Digite seu nome">
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="Digite seu CPF">
                    </div>

                    <div class="campo">
                        <label for="nascimento">Data de nascimento</label>
                        <input type="date" id="nascimento">
                    </div>

                    <div class="campo">
                        <label for="pai">Nome do pai</label>
                        <input type="text" id="pai" placeholder="Nome do pai">
                    </div>

                    <div class="campo">
                        <label for="mae">Nome da mãe</label>
                        <input type="text" id="mae" placeholder="Nome da mãe">
                    </div>

                    <div class="campo">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" placeholder="Nome da rua">
                    </div>

                    <div class="campo">
                        <label for="numero">Número da casa</label>
                        <input type="number" id="numero" placeholder="Número">
                    </div>

                    <div class="campo">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" placeholder="00000-000">
                    </div>

                    <div class="campo">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" placeholder="Nome do bairro">
                    </div>

                    <div class="campo">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" placeholder="Ex: RS">
                    </div>

                </div>

                <button type="submit">Enviar cadastro</button>

            </form>

        </div>
    </main>

</body>
</html>
